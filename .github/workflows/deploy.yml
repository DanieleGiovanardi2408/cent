name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permessi minimi: leggere il codice, scrivere su Pages, firmare il deploy con OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Un deploy alla volta. Non si cancella quello in corso: si aspetta, cosi'
# l'ultimo push non lascia Pages a meta' di una pubblicazione.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build e test unitari
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0` e non il default 1: `state --check` conta l'eta' dei
      # giudizi con `git rev-list <sha>..HEAD`, e in un clone superficiale quei
      # commit non ci sono. Col default lo script stampava quattro `fatal:` e
      # diceva "da rigenerare" a ogni push, per la ragione sbagliata — e l'unico
      # modo di scoprirlo era spingere. `.git` di questo repo pesa 6 MB.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Campi dei tipi senza un produttore, chiavi dei dizionari senza un
      # lettore. Sta **prima** dei test e dopo il typecheck di proposito: e' la
      # classe di difetti che una suite verde non vede per definizione — un campo
      # morto ha sempre i suoi test, sono loro a tenerlo in vita — e costa meno di
      # un secondo, quindi non paga per sapere che 603 test passano su codice che
      # nessuno raggiunge.
      #
      # Un reperto ferma la pipeline. La decisione su cosa cancellare resta
      # umana: lo script non tocca niente, elenca.
      - name: Campi e chiavi senza controparte
        run: npm run audit:source


      - name: Test
        run: npm test

      # Se typecheck o test falliscono il job si ferma qui e il job di deploy,
      # che dipende da questo, non parte: nessun artefatto, nessuna pubblicazione.
      - name: Build
        run: npm run build

      # ## I fatti fermano, i giudizi avvisano
      #
      # `npm run state` rigenera i fatti in cima a ROADMAP e timbra i giudizi con
      # la loro eta' in commit. Qui gira in sola lettura, e ha **due esiti**:
      #
      # - **fatti stantii -> fallisce.** La riparazione e' un comando solo, quindi
      #   bloccare non costa niente. Un avviso su una cosa che si ripara con un
      #   comando diventa carta da parati in due settimane, e allora si ha un
      #   numero falso in cima alla ROADMAP con accanto un avviso che nessuno
      #   legge: lo stato di partenza, piu' il rumore.
      # - **giudizio vecchio -> avvisa.** Ripararlo vuol dire che una persona
      #   rilegge della prosa e decide se e' ancora vera. Bloccare su quello si
      #   aggira con --no-verify il terzo giorno, ed e' la calibrazione dell'hook.
      #
      # La riga: un controllo fallisce quando la riparazione e' meccanica, avvisa
      # quando richiede un giudizio.
      #
      # ## Perche' DOPO il build e non prima
      #
      # Il peso del bundle si legge da `dist/`. Prima del build `dist/` non
      # esiste, quindi il passo non poteva ne' verificarlo ne' fallirci sopra:
      # lo avrebbe saltato dichiarandolo non misurabile, cioe' l'unico dei tre
      # numeri che nessun'altra macchina controlla sarebbe rimasto senza
      # controllo proprio dove c'era la macchina per farlo. Qui invece `dist/`
      # e' appena stato costruito da questo commit, e il confronto e' vero.
      #
      # Il confronto **salta le righe di identita' del commit** (SHA, data, stato
      # dell'albero): cambiano a ogni push per costruzione, e includerle avrebbe
      # fatto segnalare questo passo sempre — cioe' la guardia che grida al lupo,
      # che questo progetto ha gia' deciso di non sopportare altrove.
      #
      # Guarda invece cio' che costa misurare e che quindi nessuno rimisura
      # leggendo: conteggi dei test, peso del bundle, scala delle migrazioni,
      # eta' dei giudizi. Sono esattamente i due casi che hanno prodotto questo
      # passo — "533 unitari" rimasto per due consegne, e "gira la migrazione
      # 2 -> 3" con lo schema gia' a 4.
      #
      # Il valore non e' nel gate: e' nel fatto che quei numeri non si scrivono
      # piu' a mano. Questo passo rende visibile chi ha dimenticato di
      # rigenerarli, e da quanti commit un giudizio non viene riletto.
      - name: Stato corrente allineato
        run: npm run state -- --check

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Job separato, non un passo dentro `build`: un fallimento del browser deve
  # leggersi come tale nella lista dei check, senza annegare fra i test unitari.
  # Non dipende da `build` di proposito — gira in parallelo, cosi' il costo sul
  # ciclo di deploy e' la differenza fra i due job, non la loro somma.
  e2e:
    name: Test end-to-end
    runs-on: ubuntu-latest
    # Se il webServer non si alza, il job muore in fretta invece di occupare
    # il runner fino al timeout di default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # La chiave della cache e' legata alla versione di Playwright **risolta**
      # (quella che `npm ci` ha appena installato), non a una stringa fissa: un
      # bump di @playwright/test cambia la chiave, la cache non fa centro e il
      # browser viene riscaricato. Con una chiave fissa si continuerebbe a girare
      # su un Chromium vecchio, incompatibile con il runner appena installato,
      # senza alcun segnale.
      - name: Versione di Playwright
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache dei browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}
          # Nessun restore-keys: una cache parziale rimetterebbe in gioco proprio
          # il browser vecchio che la chiave versionata serve a escludere.

      # Solo chromium, mai `npx playwright install` senza argomenti: firefox e
      # webkit triplicherebbero download e spazio su disco per browser che
      # nessun progetto di playwright.config.ts usa.
      - name: Installa chromium e le sue dipendenze di sistema
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # La cache copre ~/.cache/ms-playwright, cioe' il **binario** del browser.
      # Le librerie di sistema che `--with-deps` installa via apt finiscono in
      # /usr/lib e NON sono nella cache: su cache hit vanno rimesse comunque,
      # altrimenti il chromium ripristinato non parte per un .so mancante.
      - name: Dipendenze di sistema (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # `test:e2e` fa la build e poi lancia playwright: `vite preview` serve il
      # dist reale, base path `/cent/` compreso (ADR 001).
      #
      # Il comando non cambia con ADR 021: il parallelismo sta in
      # `playwright.config.ts` (`workers: '50%'`, grano il file), non qui e non
      # negli script npm. Su un runner con 4 vCPU la regola da **2 worker**,
      # cioe' meno di cio' che e' stato misurato verde in locale a 4: se un
      # giorno GitHub cambiasse taglia al runner, il numero si adegua da solo e
      # resta dalla parte prudente.
      - name: Playwright
        run: npm run test:e2e

      - name: Report del fallimento
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    name: Deploy su Pages
    # Gli e2e bloccano la pubblicazione: cio' che proteggono — l'avvio offline e
    # i bersagli coperti da un overlay — si scopre altrimenti sul telefono, a
    # rete assente. Un minuto in piu' per deploy e' il prezzo accettato.
    needs: [build, e2e]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
