name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permessi minimi: leggere il codice, scrivere su Pages, firmare il deploy con OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Un deploy alla volta. Non si cancella quello in corso: si aspetta, cosi'
# l'ultimo push non lascia Pages a meta' di una pubblicazione.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      # Se typecheck o test falliscono il job si ferma qui e il job di deploy,
      # che dipende da questo, non parte: nessun artefatto, nessuna pubblicazione.
      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
